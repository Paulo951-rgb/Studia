<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studia — aperçu PC</title>
<style>
:root{color-scheme:dark;--bg:#0c1118;--panel:#151e29;--line:#263342;--muted:#94a3b8;--accent:#8b9cff;--text:#edf2f7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px Segoe UI,Arial,sans-serif}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{padding:24px 16px;border-right:1px solid var(--line);background:#101720}.brand{font-size:25px;font-weight:700;margin:0 0 6px}.sub{color:var(--muted);font-size:12px;margin-bottom:30px}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;color:#cbd5e1;text-align:left;padding:12px;border-radius:10px;cursor:pointer;font-size:14px}.nav button.active,.nav button:hover{background:#243047;color:white}.hint{position:absolute;bottom:18px;left:16px;right:16px;color:var(--muted);font-size:11px;line-height:1.5}.main{padding:30px;max-width:1100px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.pill{border:1px solid #6c5c2a;background:#2b2618;color:#f6d98c;border-radius:99px;padding:7px 11px;font-size:12px}.title{font-size:27px;margin:0 0 6px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:18px;margin-bottom:14px}.stat{font-size:29px;font-weight:700;margin:10px 0}.label{color:var(--muted);font-size:13px}.row{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.tag{color:#b7c2ff;background:#252e49;padding:4px 8px;border-radius:8px;font-size:12px}.bar{height:8px;background:#263342;border-radius:10px;overflow:hidden;margin-top:9px}.bar i{display:block;height:100%;background:var(--accent);width:var(--w)}input{background:#0e151e;color:white;border:1px solid var(--line);padding:12px;border-radius:9px;width:100%;margin:10px 0}button.action{background:#697cf5;color:white;border:0;border-radius:9px;padding:10px 14px;cursor:pointer}.chat{height:360px;overflow:auto;display:flex;flex-direction:column;gap:10px}.bubble{padding:12px 14px;border-radius:13px;max-width:80%;background:#202c3b;line-height:1.5}.bubble.me{align-self:flex-end;background:#303d75}.compose{display:flex;gap:8px}.compose input{margin:0}.empty{padding:25px;text-align:center;color:var(--muted)}@media(max-width:700px){.app{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line);position:relative}.nav{grid-template-columns:repeat(3,1fr)}.nav button{text-align:center;padding:9px}.hint{display:none}.main{padding:18px}.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="app"><aside class="side"><div class="brand">✦ Studia</div><div class="sub">Aperçu interactif sur PC</div><nav class="nav"><button class="active" data-page="home">⌂ Tableau de bord</button><button data-page="grades">▤ Notes</button><button data-page="homework">✓ Devoirs</button><button data-page="timetable">▦ Emploi du temps</button><button data-page="messages">✉ Messages</button><button data-page="assistant">✧ Assistant IA</button><button data-page="settings">⚙ Réglages</button></nav><div class="hint">DÉMO LOCALE<br>Les données sont fictives. Aucun compte PRONOTE ni aucune clé API ne sont utilisés.</div></aside><main class="main"><div class="top"><div><h1 class="title" id="heading">Bonjour !</h1><div class="muted" id="subtitle">Voici votre aperçu scolaire.</div></div><span class="pill">MODE DÉMONSTRATION · DONNÉES FICTIVES</span></div><section id="content"></section></main></div>
<script>
const pages={
home:{title:'Bonjour !',sub:'Voici votre aperçu scolaire.',html:`<div class="grid"><div class="card"><div class="label">Moyenne générale</div><div class="stat">14,2/20</div><span class="tag">+0,4 ce trimestre</span></div><div class="card"><div class="label">Devoirs à faire</div><div class="stat">4</div><span class="tag">2 pour demain</span></div><div class="card"><div class="label">Prochain cours</div><div class="stat">Maths</div><div class="label">10:00 · Salle B204</div></div></div><div class="card"><h3>À venir</h3><div class="row"><span>Contrôle de mathématiques</span><b>Demain</b></div><div class="row"><span>Rendre l'exercice de français</span><b>Jeudi</b></div><div class="row"><span>Évaluation d'histoire</span><b>Vendredi</b></div></div><div class="card"><h3>Progression par matière</h3><p>Mathématiques <b style="float:right">15,5</b><div class="bar"><i style="--w:77.5%"></i></div></p><p>Français <b style="float:right">13,0</b><div class="bar"><i style="--w:65%"></i></div></p><p>Histoire-géo <b style="float:right">14,0</b><div class="bar"><i style="--w:70%"></i></div></p></div>`},
grades:{title:'Notes et moyennes',sub:'Exemple de relevé — trimestre 2.',html:`<div class="card"><div class="row"><b>Matière</b><b>Note</b><b>Moyenne</b></div><div class="row"><span>Mathématiques</span><span>16/20</span><b>15,5</b></div><div class="row"><span>Français</span><span>12/20</span><b>13,0</b></div><div class="row"><span>Histoire-géo</span><span>14/20</span><b>14,0</b></div><div class="row"><span>Anglais</span><span>17/20</span><b>16,2</b></div></div>`},
homework:{title:'Devoirs',sub:'Cochez les devoirs terminés (état temporaire dans cette page).',html:`<div class="card" id="tasks"><label class="row"><span><input type="checkbox" style="width:auto;margin:0 10px 0 0">Exercices 12 à 15 — Mathématiques</span><b>Demain</b></label><label class="row"><span><input type="checkbox" style="width:auto;margin:0 10px 0 0">Lire le chapitre 4 — Français</span><b>Demain</b></label><label class="row"><span><input type="checkbox" style="width:auto;margin:0 10px 0 0">Réviser la leçon — Histoire</span><b>Vendredi</b></label><label class="row"><span><input type="checkbox" style="width:auto;margin:0 10px 0 0">Terminer le poster — Anglais</span><b>Lundi</b></label></div>`},
timetable:{title:'Emploi du temps',sub:'Exemple d’une journée.',html:`<div class="card"><div class="row"><b>Horaire</b><b>Cours</b><b>Salle</b></div><div class="row"><span>08:00–09:00</span><b>Français</b><span>A102</span></div><div class="row"><span>09:00–10:00</span><b>Histoire-géo</b><span>C201</span></div><div class="row"><span>10:15–11:15</span><b>Mathématiques</b><span>B204</span></div><div class="row"><span>13:30–14:30</span><b>Anglais</b><span>A105</span></div></div>`},
messages:{title:'Messages',sub:'Exemples de messages scolaires fictifs.',html:`<div class="card"><div class="row"><b>Vie scolaire</b><span class="tag">Aujourd'hui</span></div><p>Bonjour, pensez à rapporter votre autorisation signée pour la sortie.</p><div class="row"><b>Professeur de mathématiques</b><span class="tag">Hier</span></div><p>La correction du dernier contrôle sera distribuée en classe.</p></div>`},
assistant:{title:'Assistant IA',sub:'Conversation de démonstration : aucune requête OpenAI réelle.',html:`<div class="card"><div class="chat" id="chat"><div class="bubble">Bonjour ! Je suis l’assistant de démonstration Studia. Je peux illustrer le fonctionnement, mais je n’accède pas à tes vraies données scolaires.</div></div><div class="compose"><input id="question" placeholder="Écris un message de test…"><button class="action" id="send">Envoyer</button></div></div>`},
settings:{title:'Réglages',sub:'Configuration fictive de la prévisualisation.',html:`<div class="card"><h3>Connexion PRONOTE</h3><p class="muted">Désactivée dans cette démo. Aucun identifiant ne doit être saisi ici.</p><span class="tag">Simulateur uniquement</span></div><div class="card"><h3>Assistant IA</h3><p class="muted">Aucune clé API chargée. Pour utiliser OpenAI, il faudra passer par l’application native et son stockage sécurisé.</p></div><div class="card"><h3>Confidentialité</h3><p class="muted">Cette page utilise uniquement des exemples intégrés. Aucun réseau, stockage ni suivi.</p></div>`}
};
function show(name){const p=pages[name]||pages.home;document.getElementById('heading').textContent=p.title;document.getElementById('subtitle').textContent=p.sub;document.getElementById('content').innerHTML=p.html;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===name));if(name==='assistant'){document.getElementById('send').onclick=send;document.getElementById('question').addEventListener('keydown',e=>{if(e.key==='Enter')send()})}}
function send(){const input=document.getElementById('question'),chat=document.getElementById('chat'),v=input.value.trim();if(!v)return;const me=document.createElement('div');me.className='bubble me';me.textContent=v;chat.append(me);const answer=document.createElement('div');answer.className='bubble';answer.textContent='Ceci est une réponse fictive. Dans la vraie application, Studia utiliserait les outils locaux autorisés et, si tu as donné ton consentement, ta clé API OpenAI.';chat.append(answer);input.value='';chat.scrollTop=chat.scrollHeight}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>show(b.dataset.page));show('home');
</script></body></html>
