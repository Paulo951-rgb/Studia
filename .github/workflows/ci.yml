name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  EXPO_NO_TELEMETRY: '1'
  CI: '1'

jobs:
  verify:
    name: Types, tests et bundles
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Verifier les types TypeScript
        run: npm run typecheck

      - name: Executer les tests
        run: npm test

      - name: Verifier le bundle Android
        run: npx expo export --platform android --output-dir /tmp/bundle-android

      - name: Verifier le bundle iOS
        run: npx expo export --platform ios --output-dir /tmp/bundle-ios
